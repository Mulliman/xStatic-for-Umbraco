# Dependabot version updates: monthly PRs that keep dependencies current on every supported branch
# (see SECURITY.md). This file is only read from master, so the target-branch entries cover the other branches.
#
# Rules shared by every entry:
#   - Umbraco packages (Umbraco.*, @umbraco-cms/*, @umbraco-ui/*) are never bumped here. They're bumped together by hand,
#     because their version sets the minimum Umbraco version consumers need (see AGENTS.md).
#   - Minor and patch updates are grouped into one PR per ecosystem and folder, to keep the number of PRs down.
#   - NuGet majors are ignored everywhere: a major usually means a new .NET or Umbraco line, which needs its own branch.
#   - npm majors are only proposed on master. lts/17 and feature/19 get minor and patch updates only.
#
# Security updates (Repository settings → Code security → Dependabot security updates) are separate from this file.
# They open PRs against master as soon as an advisory is published.

version: 2

updates:
  # ---------------------------------------------------------------- master (Umbraco 18)
  - package-ecosystem: "nuget"
    directory: "/Source/XStaticCore"
    target-branch: "master"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "Umbraco.*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/Source/XStaticCore/XStatic14/XStatic14.Client/assets"
    target-branch: "master"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "@umbraco-cms/*"
      - dependency-name: "@umbraco-ui/*"
    groups:
      client-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/Source/xstatic-mcp"
    target-branch: "master"
    schedule:
      interval: "monthly"
    groups:
      mcp-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/Testing/Playwright"
    target-branch: "master"
    schedule:
      interval: "monthly"
    groups:
      playwright-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  # ---------------------------------------------------------------- lts/17 (Umbraco 17 LTS)
  - package-ecosystem: "nuget"
    directory: "/Source/XStaticCore"
    target-branch: "lts/17"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "Umbraco.*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/Source/XStaticCore/XStatic14/XStatic14.Client/assets"
    target-branch: "lts/17"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "@umbraco-cms/*"
      - dependency-name: "@umbraco-ui/*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      client-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/Source/xstatic-mcp"
    target-branch: "lts/17"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      mcp-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "lts/17"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  # ---------------------------------------------------------------- feature/19 (Umbraco 19, pre-release)
  - package-ecosystem: "nuget"
    directory: "/Source/XStaticCore"
    target-branch: "feature/19"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "Umbraco.*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/Source/XStaticCore/XStatic14/XStatic14.Client/assets"
    target-branch: "feature/19"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "@umbraco-cms/*"
      - dependency-name: "@umbraco-ui/*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      client-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/Source/xstatic-mcp"
    target-branch: "feature/19"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      mcp-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "feature/19"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
