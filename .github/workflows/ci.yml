name: "CI"

# Every PR and every push to master / feature / lts branches:
#   1. builds and tests (test.yml)
#   2. packs all packages at a preview version (pack.yml), uploaded as the "nuget-packages" artifact
#   3. publishes them to this repo's GitHub Packages NuGet feed. Skipped for PRs from forks and Dependabot,
#      which get a read-only token. Their packages are still downloadable from the run's artifact.
#
# Versions come from the nearest v* tag (see .github/scripts/Get-PreviewVersion.ps1):
#   PR builds:   17.3.0-pr.<PR number>.<run number>
#   Branch pushes: 17.3.0-preview.<run number>
# nuget.org only ever gets packages from release.yml.

on:
  pull_request:
  push:
    branches:
      - master
      - 'feature/**'
      - 'lts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 'Test'
    uses: ./.github/workflows/test.yml

  version:
    name: 'Work out preview version'
    runs-on: 'ubuntu-latest'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # tags are needed to work out the version

      - name: 'Work out version'
        id: version
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $suffix = if ($env:PR_NUMBER) { "pr.$env:PR_NUMBER.$env:RUN_NUMBER" } else { "preview.$env:RUN_NUMBER" }
          $version = ./.github/scripts/Get-PreviewVersion.ps1 -Suffix $suffix
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Preview version: $version"

  pack:
    name: 'Pack'
    needs: [test, version]
    uses: ./.github/workflows/pack.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish-preview:
    name: 'Publish to GitHub Packages'
    needs: [pack, version]
    # Fork and Dependabot PRs get a read-only token, so they can't publish (by design).
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
    steps:
      - name: 'Download packages'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages
          path: packages

      - name: 'Install dotnet'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # GitHub Packages doesn't host .snupkg symbol packages; they stay in the run's artifact.
      - name: 'Push to GitHub Packages'
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source "$FEED_URL" --skip-duplicate --no-symbols

      - name: 'Write install instructions'
        run: |
          cat > install.md <<EOF
          <!-- xstatic-preview-packages -->
          ### 📦 Preview packages: \`$VERSION\`

          This build is on the [GitHub Packages feed](https://github.com/${{ github.repository }}/packages). To try it in an Umbraco site:

          \`\`\`powershell
          # One-off: add the feed. GitHub Packages needs a personal access token (classic) with read:packages, even for public packages.
          dotnet nuget add source "$FEED_URL" --name xstatic-preview --username <github-username> --password <token>

          dotnet add package xStatic --version $VERSION --source xstatic-preview
          \`\`\`

          The packages (including symbols) are also attached to [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) as the \`nuget-packages\` artifact.
          EOF
          cat install.md >> "$GITHUB_STEP_SUMMARY"

      - name: 'Comment on the PR'
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('install.md', 'utf8');
            const marker = '<!-- xstatic-preview-packages -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
