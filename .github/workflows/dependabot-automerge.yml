# Turns on auto-merge for Dependabot minor and patch updates (including security fixes).
# GitHub only merges once the required checks in branch protection pass, so a red PR is never merged.
# Major version updates are left for a person to review, and so is anything not aimed at a supported release
# branch (master, lts/* or a version branch such as feature/19).
name: 'Dependabot auto-merge'

on: pull_request

permissions: {}

jobs:
  auto-merge:
    name: 'Enable auto-merge'
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'Mulliman/xStatic-for-Umbraco' &&
      (github.event.pull_request.base.ref == 'master' ||
       startsWith(github.event.pull_request.base.ref, 'lts/') ||
       startsWith(github.event.pull_request.base.ref, 'feature/'))
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 'Read Dependabot metadata'
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: 'Enable auto-merge for minor and patch updates'
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
