name: "OpenSSF Scorecard"

# The Open Source Security Foundation's Scorecard rates the repository's security practices from 0 to 10
# (code review, branch protection, dependency updates, pinned dependencies, token permissions, and so on).
# Results appear under Security → Code scanning. The public score, shown by the README badge, is at
# https://scorecard.dev/viewer/?uri=github.com/Mulliman/xStatic-for-Umbraco
#
# publish_results: true has rules: no top-level env or defaults, only approved actions, and a GitHub-hosted
# Ubuntu runner. Keep to them when editing this file, or the publish step is rejected.

on:
  branch_protection_rule:  # re-score when branch protection changes
  schedule:
    - cron: '41 2 * * 6'  # Saturdays 02:41 UTC
  push:
    branches:
      - master
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: 'Scorecard analysis'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
      actions: read
      security-events: write  # upload results to code scanning
      id-token: write         # publish the results so the badge works
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Run Scorecard'
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: 'Upload results as an artifact'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: 'Upload results to code scanning'
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
