name: "Wiki"

# The wiki is written in the Wiki/ folder of this repo and published to the GitHub wiki
# (https://github.com/Mulliman/xStatic-for-Umbraco/wiki) by this workflow.
#
#   Pull requests that touch Wiki/ or Tools/Wiki/: check links, anchors, images and the sidebar.
#   Pushes to master that touch Wiki/: check, then publish to the wiki repository.
#
# Don't edit pages on github.com: the next publish overwrites them. Edit Wiki/ and open a PR.
# One-off setup: the wiki must exist before the first publish. Enable Wikis in the repo settings
# and save any first page on github.com, so that <repo>.wiki.git is created.

on:
  pull_request:
    paths:
      - 'Wiki/**'
      - 'Tools/Wiki/**'
      - '.github/workflows/wiki.yml'
  push:
    branches:
      - master
    paths:
      - 'Wiki/**'
      - 'Tools/Wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 'Check wiki'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: 'Install Node'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 'Check pages'
        run: node Tools/Wiki/wiki.mjs check

  publish:
    name: 'Publish wiki'
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write  # pushing to <repo>.wiki.git uses the contents permission
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: 'Install Node'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 'Checkout wiki'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-out

      - name: 'Build pages into the wiki'
        run: node Tools/Wiki/wiki.mjs build wiki-out --repo-url "${{ github.server_url }}/${{ github.repository }}" --branch master

      - name: 'Commit and push'
        working-directory: wiki-out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git commit -m "Publish wiki from ${GITHUB_SHA::7}"
          git push
