name: xStatic MCP Server

on:
  push:
    branches:
      - master
      - 'lts/**'
      - 'feature/[0-9]*'
    paths:
      - 'Source/xstatic-mcp/**'
      - '.github/workflows/xStatic.Mcp.yml'
  pull_request:
    paths:
      - 'Source/xstatic-mcp/**'
      - '.github/workflows/xStatic.Mcp.yml'

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Source/xstatic-mcp

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Source/xstatic-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
